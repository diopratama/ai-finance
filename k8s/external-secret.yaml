apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-finance-secret
  namespace: ai-finance
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ai-finance-secret
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: ai-finance

